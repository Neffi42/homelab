name: iac-dns

on:
  push:
    branches: [main]
    paths: ["iac/dns/**"]
  schedule:
    - cron: "0 0 * * *" # drift: iac/dns reads live cluster state, not just git diff
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: default
    steps:
      - uses: actions/checkout@v4

      - name: install opentofu
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://get.opentofu.org/install-opentofu.sh | \
            sh -s -- --install-method standalone --install-path "$RUNNER_TEMP/bin" --skip-verify \
              --opentofu-version 1.12.6
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: debug workspace
        run: |
          echo "PWD: $(pwd)"
          ls -la "$GITHUB_WORKSPACE/iac/dns"

      - name: apply - oliver
        run: |
          set -e
          echo "${{ secrets.KUBECONFIG_OLIVER }}" > "$RUNNER_TEMP/kubeconfig"
          export KUBE_CONFIG_PATH="$RUNNER_TEMP/kubeconfig"
          export TF_VAR_pihole_url="${{ secrets.PIHOLE_URL }}"
          export TF_VAR_pihole_password="${{ secrets.PIHOLE_PASSWORD }}"
          export TF_VAR_ovh_client_id="${{ secrets.OVH_CLIENT_ID }}"
          export TF_VAR_ovh_client_secret="${{ secrets.OVH_CLIENT_SECRET }}"
          export TF_VAR_ovh_target_ip="${{ secrets.OVH_TARGET_IP }}"
          cd "$GITHUB_WORKSPACE/iac/dns"
          tofu init -input=false -reconfigure
          tofu plan -input=false -parallelism=1 -out=tfplan
          tofu apply -input=false -auto-approve -parallelism=1 tfplan

      - name: apply - raspberrypi
        run: |
          set -e
          echo "${{ secrets.KUBECONFIG_RASPBERRYPI }}" > "$RUNNER_TEMP/kubeconfig"
          export KUBE_CONFIG_PATH="$RUNNER_TEMP/kubeconfig"
          export TF_VAR_pihole_url="${{ secrets.PIHOLE_URL }}"
          export TF_VAR_pihole_password="${{ secrets.PIHOLE_PASSWORD }}"
          export TF_VAR_ovh_client_id="${{ secrets.OVH_CLIENT_ID }}"
          export TF_VAR_ovh_client_secret="${{ secrets.OVH_CLIENT_SECRET }}"
          export TF_VAR_ovh_target_ip="${{ secrets.OVH_TARGET_IP }}"
          cd "$GITHUB_WORKSPACE/iac/dns"
          tofu init -input=false -reconfigure
          tofu plan -input=false -parallelism=1 -out=tfplan
          tofu apply -input=false -auto-approve -parallelism=1 tfplan
