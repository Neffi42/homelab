name: iac-oauth

on:
  push:
    branches: [main]
    paths: ["iac/oauth/**"]
  workflow_dispatch:
    inputs:
      rotate:
        description: "OAuth2 clients whose secret to regenerate (space-separated names, or 'all')"
        type: string
        required: false
        default: ""

jobs:
  apply:
    runs-on: default
    steps:
      - uses: actions/checkout@v4

      - name: cache opentofu
        id: cache-opentofu
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bin
          key: opentofu-1.12.6-${{ runner.os }}

      - name: install opentofu
        if: steps.cache-opentofu.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://get.opentofu.org/install-opentofu.sh | \
            sh -s -- --install-method standalone --install-path "$RUNNER_TEMP/bin" --skip-verify \
              --opentofu-version 1.12.6

      - name: add opentofu to PATH
        run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: apply
        env:
          ROTATE: ${{ inputs.rotate }}
        run: |
          set -e
          echo "${{ secrets.KUBECONFIG_OLIVER }}" > "$RUNNER_TEMP/kubeconfig"
          export KUBE_CONFIG_PATH="$RUNNER_TEMP/kubeconfig"
          export TF_VAR_kanidm_token="${{ secrets.KANIDM_TOKEN }}"
          export TF_VAR_cla_mail="${{ secrets.MAIL_CLA }}"
          export TF_VAR_bot_oliver_mail="${{ secrets.MAIL_BOT_OLIVER }}"
          export BWS_ACCESS_TOKEN="${{ secrets.BWS_ACCESS_TOKEN }}"
          cd "$GITHUB_WORKSPACE/iac/oauth"
          tofu init -input=false -reconfigure
          # The provider only reads a client secret on create: rotating means replacing the client.
          if [ "$ROTATE" = all ]; then
            ROTATE=$(tofu state list | sed -n 's/^kanidm_oauth2_basic\.//p')
          fi
          set --
          for client in $ROTATE; do
            set -- "$@" "-replace=kanidm_oauth2_basic.$client"
          done
          tofu plan -input=false "$@" -out=tfplan
          tofu apply -input=false -auto-approve tfplan
