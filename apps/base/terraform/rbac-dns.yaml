---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dns-reader
  namespace: terraform
---
apiVersion: v1
kind: Secret
metadata:
  name: dns-reader-token
  namespace: terraform
  annotations:
    kubernetes.io/service-account.name: dns-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dns-reader
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "gateways"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dns-reader
subjects:
  - kind: ServiceAccount
    name: dns-reader
    namespace: terraform
roleRef:
  kind: ClusterRole
  name: dns-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dns-reader-state
  namespace: terraform
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dns-reader-state
  namespace: terraform
subjects:
  - kind: ServiceAccount
    name: dns-reader
    namespace: terraform
roleRef:
  kind: Role
  name: dns-reader-state
  apiGroup: rbac.authorization.k8s.io
