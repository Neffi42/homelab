---
# yaml-language-server: $schema=https://schemas.neffi.fr/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-oauth2-proxy-cookie
spec:
  # oauth2-proxy needs a 16, 24 or 32 byte cookie secret.
  length: 32
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://schemas.neffi.fr/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oauth2-proxy-cookie
spec:
  # Regenerating only logs everyone out, but there's no reason to rotate it.
  refreshPolicy: CreatedOnce
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-oauth2-proxy-cookie
