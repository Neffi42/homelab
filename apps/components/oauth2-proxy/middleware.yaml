---
# yaml-language-server: $schema=https://schemas.neffi.fr/traefik.io/middleware_v1alpha1.json
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ${APP}-oauth2-proxy
spec:
  forwardAuth:
    # Root, not /oauth2/auth: unauthenticated requests get oauth2-proxy's redirect to Kanidm.
    address: http://${APP}-oauth2-proxy.${OAUTH2_PROXY_NAMESPACE}.svc.cluster.local:4180/
    trustForwardHeader: true
