---
# yaml-language-server: $schema=https://schemas.neffi.fr/gateway.networking.k8s.io/backendtlspolicy_v1alpha3.json
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: kanidm-backend-tls
spec:
  targetRefs:
    - kind: Service
      name: kanidm
      group: ""
      sectionName: https
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: kanidm-ca-cert
    hostname: kanidm.auth.svc.cluster.local
