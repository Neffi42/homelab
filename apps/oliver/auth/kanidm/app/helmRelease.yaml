---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kanidm
spec:
  chartRef:
    kind: OCIRepository
    name: kanidm
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      kanidm:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/kanidm/server
              tag: 1.10.4@sha256:d68cc899542fa494120f4014a76c59d5beacad8ee1673e1e62e95f82a332fb68
            env:
              KANIDM_ADMIN_BIND_PATH: /var/run/kanidm.sock
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: &port 8443
                    scheme: HTTPS
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: kanidm
        forceRename: kanidm
        ports:
          http:
            port: *port
          ldap:
            port: 3636
    route:
      app:
        hostnames:
          - "auth.neffi.fr"
        parentRefs:
          - name: private
            namespace: network
    persistence:
      config:
        type: configMap
        name: kanidm-config
        advancedMounts:
          kanidm:
            app:
              - path: /data/server.toml
                subPath: server.toml
      data:
        accessMode: ReadWriteOnce
        size: 100Mi
        advancedMounts:
          kanidm:
            app:
              - path: /data
                subPath: data
      tls:
        type: secret
        name: kanidm-tls
        defaultMode: 0400
        advancedMounts:
          kanidm:
            app:
              - path: /certs
      tmpfs:
        type: emptyDir
        advancedMounts:
          kanidm:
            app:
              - path: /var/run
