---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm
  namespace: flux-system
spec:
  components:
    - ../../../../components/kopiur
    - ../../../../components/app-template
  dependsOn:
    - name: local-path
    - name: kopiur-config
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kanidm
      namespace: auth
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: SnapshotPolicy
      name: kanidm-data
      namespace: auth
  interval: 1h
  path: "./apps/oliver/auth/kanidm/app"
  postBuild:
    substitute:
      APP: kanidm
      KOPIUR_NAME: kanidm-data
      KOPIUR_KEEPDAILY: "14"
      KOPIUR_KEEPWEEKLY: "4"
      KOPIUR_CRON: "H 1 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: auth
  timeout: 5m
