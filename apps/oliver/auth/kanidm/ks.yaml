---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm
  namespace: flux-system
spec:
  dependsOn:
    - name: local-path
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kanidm
      namespace: auth
  interval: 1h
  path: "./apps/oliver/auth/kanidm/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: auth
  timeout: 5m
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-backup
  namespace: flux-system
spec:
  dependsOn:
    - name: kanidm
    - name: kopiur-config
  healthChecks:
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: SnapshotPolicy
      name: kanidm-data
      namespace: auth
  interval: 1h
  path: "./apps/oliver/auth/kanidm/config"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: auth
  timeout: 5m
