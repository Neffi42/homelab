# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
spec:
  interval: 10m
  chart:
    spec:
      chart: zitadel
      version: "10.0.4"
      sourceRef:
        kind: HelmRepository
        name: zitadel
  values:
    postgresql:
      enabled: false

    envVarsSecret: "zitadel-credentials"

    zitadel:
      masterkeySecretName: "zitadel-credentials"
      configmapConfig:
        Database:
          postgres:
            MaxOpenConns: 20
            MaxIdleConns: 10
        ExternalDomain: &hostname "auth.neffi.fr"
        ExternalSecure: true
        TLS:
          Enabled: false
        FirstInstance:
          Org:
            Human:
              PasswordChangeRequired: false
        DefaultInstance:
          LoginPolicy:
            AllowRegister: false

    gateway:
      httpRoute:
        enabled: true
        hostnames:
          - *hostname
        parentRefs: &gateway
          - name: private
            namespace: network
            sectionName: https

    login:
      gateway:
        httpRoute:
          enabled: true
          hostnames:
            - *hostname
          parentRefs: *gateway
