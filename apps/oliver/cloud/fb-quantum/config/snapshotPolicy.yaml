---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: fb-quantum-data
spec:
  repository:
    kind: ClusterRepository
    name: garage-raspberrypi
  credentialProjection:
    enabled: true
  # oliver has no CSI snapshot-controller/VolumeSnapshotClass (local-path only).
  copyMethod: Direct
  compression:
    compressor: zstd
  mover:
    # filebrowser image runs 1000:1000 (checked: `id` in the pod, and database.db
    # is 0600 owned by 1000), but the chart pins no runAsUser anywhere -> pure
    # pvcConsumer inherit would hit InheritPinnedNoUid and fall back to 65532.
    # Keep pvcConsumer in case the chart ever starts pinning a UID; the explicit
    # runAsUser is what actually makes it work today.
    inheritSecurityContextFrom:
      pvcConsumer: {}
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
  sources:
    - pvc:
        name: fb-quantum
  retention:
    keepDaily: 14
    keepWeekly: 4
