---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fb-quantum
  namespace: flux-system
spec:
  components:
    - ../../../../components/kopiur
    - ../../../../components/app-template
  dependsOn:
    - name: local-path
    - name: kopiur-config
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: fb-quantum
      namespace: cloud
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: SnapshotPolicy
      name: fb-quantum-data
      namespace: cloud
  interval: 1h
  path: "./apps/oliver/cloud/fb-quantum/app"
  patches:
    - patch: |
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: SnapshotPolicy
        metadata:
          name: not-used
        spec:
          mover:
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
      target:
        kind: SnapshotPolicy
  postBuild:
    substitute:
      APP: fb-quantum
      KOPIUR_NAME: fb-quantum-data
      KOPIUR_KEEPDAILY: "14"
      KOPIUR_KEEPWEEKLY: "4"
      KOPIUR_CRON: "H 4 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: cloud
  timeout: 5m
