  default-src: ["'none'"]
  font-src: ["'self'"]
  frame-ancestors: ["'self'"]
  frame-src: ["'self'", "blob:", "https://embed.diagrams.net/", "https://docs.opencloud.eu", "https://auth.neffi.fr/"]
  img-src: ["'self'", "data:", "blob:", "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/"]
  manifest-src: ["'self'"]
  media-src: ["'self'", "blob:"]
  object-src: ["'self'", "blob:"]
  script-src: ["'self'", "'unsafe-inline'", "https://auth.neffi.fr/"]
  style-src: ["'self'", "'unsafe-inline'", "blob:"]
  worker-src: ["'self'", "blob:"]
