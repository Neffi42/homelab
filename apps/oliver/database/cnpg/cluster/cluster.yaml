---
# yaml-language-server: $schema=https://schemas.neffi.fr/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-cluster
  namespace: database
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:58d19a1edb30d42fc2be3470ac7719caa496a4f3a7f1289472d6c3f6b04c8fd1
  affinity:
    nodeSelector:
      kubernetes.io/hostname: oliver
  storage:
    size: 8Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-cluster-barman
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: app-db-credentials
  managed:
    roles:
      - name: ferdium
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: ferdium-credentials
      - name: forgejo
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: forgejo-credentials
      - name: mautrix_whatsapp
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: mautrix-whatsapp-credentials
