# yaml-language-server: $schema=https://schemas.neffi.fr/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-barman-garage-creds
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: cnpg-barman-garage-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        REGION: "garage"
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: "72ddf170-07f2-4d80-8bd8-b49800b1b220"
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: "c4f8951b-2f4f-4731-9b21-b49800b1ccbb"
---
# yaml-language-server: $schema=https://schemas.neffi.fr/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-barman-hetzner-1-creds
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: cnpg-barman-hetzner-1-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        REGION: "hetzner-1"
  data:
    # same Bitwarden items as rclone-s3-creds (apps/oliver/storage/rclone-s3/app/externalSecret.yaml)
    # -- the shim's own --auth-key, reshaped to the AWS_* names barman-cloud expects.
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: "d8a099d5-62e9-4789-b2d2-b4ba00ea0701"
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: "c4d9f3d7-c2bc-4ac5-bb1b-b4ba00ea40d5"
