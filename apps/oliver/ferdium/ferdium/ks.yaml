---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ferdium
  namespace: flux-system
spec:
  components:
    - ../../../../components/kopiur
    - ../../../../components/app-template
  dependsOn:
    - name: local-path
    - name: cnpg-cluster
    # - name: kopiur-config
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: ferdium
      namespace: ferdium
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: SnapshotPolicy
      name: ferdium
      namespace: ferdium
  interval: 1h
  path: "./apps/oliver/ferdium/ferdium/app"
  postBuild:
    substitute:
      APP: ferdium
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ferdium
  timeout: 5m
