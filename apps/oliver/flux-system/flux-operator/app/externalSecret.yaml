---
# yaml-language-server: $schema=https://schemas.neffi.fr/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-operator-web-config
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    template:
      engineVersion: v2
      data:
        # Default impersonation: username from `email`, groups from `groups` (names, via groups_name).
        config.yaml: |
          apiVersion: web.fluxcd.controlplane.io/v1
          kind: Config
          spec:
            baseURL: https://flux.neffi.fr
            authentication:
              type: OAuth2
              oauth2:
                provider: OIDC
                clientID: flux
                clientSecret: "{{ .clientSecret }}"
                issuerURL: https://auth.neffi.fr/oauth2/openid/flux
                # Only what the Kanidm scope_map grants; the default list adds offline_access and groups.
                scopes: [openid, profile, email, groups_name]
  data:
    - secretKey: clientSecret
      remoteRef:
        key: "9b6141ef-8fba-414e-926f-b50700cf8dbb"
