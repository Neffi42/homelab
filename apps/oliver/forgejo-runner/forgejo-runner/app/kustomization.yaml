# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./externalSecret.yaml
  - ./helmRelease.yaml

configMapGenerator:
  - name: forgejo-runner-config
    files:
      - runner.yaml=./resources/runner.yaml
      - podspec-default.yaml=./resources/podspec-default.yaml
      - podspec-dind.yaml=./resources/podspec-dind.yaml

generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
