---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: forgejo-data
spec:
  repository:
    kind: ClusterRepository
    name: garage-raspberrypi
  credentialProjection:
    enabled: true
  # oliver has no CSI snapshot-controller/VolumeSnapshotClass (local-path only).
  copyMethod: Direct
  mover:
    # forgejo's chart never pins runAsUser (checked: container securityContext is
    # {}, pod-level is only fsGroup:1000), so pvcConsumer alone can't inherit an
    # identity -> InheritPinnedNoUid, falls back to the default UID 65532, which
    # can't read gitea/ or git/.ssh (both 0700, rootless forgejo image runs 1000:1000).
    # Keep pvcConsumer so this self-upgrades if the chart ever starts pinning a UID;
    # the explicit runAsUser is what actually makes it work today.
    inheritSecurityContextFrom:
      pvcConsumer: {}
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
  compression:
    compressor: zstd
  sources:
    - pvc:
        name: gitea-shared-storage
  retention:
    keepDaily: 14
    keepWeekly: 4
