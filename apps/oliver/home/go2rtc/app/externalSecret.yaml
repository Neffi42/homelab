---
# yaml-language-server: $schema=https://schemas.neffi.fr/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: go2rtc-credentials
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
    - secretKey: CAMERA_STREAM_URL
      remoteRef:
        key: "db184f4a-b047-40d2-803a-b4c30106471b"
---
# yaml-language-server: $schema=https://schemas.neffi.fr/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: go2rtc-oauth-credentials
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
    - secretKey: client-secret
      remoteRef:
        key: "031ea2b2-428b-42d3-9f68-b4d200f02f34"
---
# yaml-language-server: $schema=https://schemas.neffi.fr/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: go2ptz-credentials
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: go2ptz-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Tapo: ONVIF uses the same camera account as RTSP, on port 2020. Assumes the userinfo
        # in the stream URL is not percent-encoded.
        ONVIF_ADDRESS: '{{ (urlParse .url).hostname }}:2020'
        ONVIF_USERNAME: '{{ (urlParse .url).userinfo | splitList ":" | first }}'
        ONVIF_PASSWORD: '{{ (urlParse .url).userinfo | splitList ":" | rest | join ":" }}'
  data:
    - secretKey: url
      remoteRef:
        key: "db184f4a-b047-40d2-803a-b4c30106471b"
