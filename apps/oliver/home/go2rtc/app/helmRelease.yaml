# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: go2rtc
spec:
  chartRef:
    kind: OCIRepository
    name: go2rtc
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      go2rtc:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: docker.io/alexxit/go2rtc
              tag: 1.9.14
            restartPolicy: Always
            envFrom:
              - secretRef:
                  name: go2rtc-credentials
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &httpPort 1984
                    path: /
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 5
              readiness: *probe
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      go2rtc:
        controller: go2rtc
        ports:
          http:
            port: *httpPort
            protocol: TCP
    configMaps:
      config:
        enabled: true
        data:
          go2rtc.yaml: |
            streams:
              camera1: "$${CAMERA_STREAM_URL}"
            api:
              listen: ":1984"
    persistence:
      config:
        type: configMap
        identifier: config
        advancedMounts:
          go2rtc:
            app:
              - path: /config/go2rtc.yaml
                subPath: go2rtc.yaml
                readOnly: true
    route:
      http:
        kind: HTTPRoute
        hostnames:
          - "go2rtc.neffi.fr"
        parentRefs:
          - name: private
            namespace: network
        rules:
          - backendRefs:
              - name: go2rtc
                port: *httpPort
