---
# yaml-language-server: $schema=https://schemas.neffi.fr/traefik.io/ingressrouteudp_v1alpha1.json
# Traefik has no Gateway API UDPRoute support.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteUDP
metadata:
  name: go2rtc-webrtc
spec:
  entryPoints:
    - webrtc-udp
  routes:
    - services:
        - name: go2rtc-webrtc-udp
          port: 8555
