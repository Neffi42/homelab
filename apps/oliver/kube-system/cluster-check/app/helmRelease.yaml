# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cluster-check
spec:
  chartRef:
    kind: OCIRepository
    name: cluster-check
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
    controllers:
      cluster-check:
        type: cronjob
        cronjob:
          schedule: "15 * * * *"
          concurrencyPolicy: Forbid
          backoffLimit: 0
          ttlSecondsAfterFinished: 86400
          successfulJobsHistory: 1
          failedJobsHistory: 1
        serviceAccount:
          identifier: cluster-check
        pod:
          # app-template defaults this to false; the script reads the API with the SA token.
          automountServiceAccountToken: true
        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: 3.15.2-alpine3.24@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
            command: [python3, /scripts/cluster-check.py]
            env:
              PYTHONDONTWRITEBYTECODE: "1"
              GRACE_MINUTES: "15"
              # Matches the hourly schedule, so each restart/Job failure is reported once.
              LOOKBACK_MINUTES: "60"
              SNAPSHOT_MAX_HOURS: "26"
              MATRIX_ADDRESS: http://continuwuity.matrix.svc.cluster.local
              MATRIX_ROOM: "!gPFPE-MqiqNH1zLGQbTpLwPiIedUn5F4PE6scgkeAVQ"
              MATRIX_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: matrix-alerts
                    key: token
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    serviceAccount:
      cluster-check: {}
    rbac:
      roles:
        cluster-check:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: [pods]
              verbs: [list]
            - apiGroups: [batch]
              resources: [jobs]
              verbs: [list]
            - apiGroups: [external-secrets.io]
              resources: [externalsecrets, clustersecretstores]
              verbs: [list]
            - apiGroups: [cert-manager.io]
              resources: [certificates]
              verbs: [list]
            - apiGroups: [helm.toolkit.fluxcd.io]
              resources: [helmreleases]
              verbs: [list]
            - apiGroups: [source.toolkit.fluxcd.io]
              resources: [ocirepositories, helmrepositories]
              verbs: [list]
            - apiGroups: [kopiur.home-operations.com]
              resources: [snapshotpolicies]
              verbs: [list]
            - apiGroups: [postgresql.cnpg.io]
              resources: [clusters]
              verbs: [list]
      bindings:
        cluster-check:
          type: ClusterRoleBinding
          roleRef:
            identifier: cluster-check
          subjects:
            - identifier: cluster-check
    persistence:
      script:
        type: configMap
        name: cluster-check
        globalMounts:
          - path: /scripts
            readOnly: true
