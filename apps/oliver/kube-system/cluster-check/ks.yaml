---
# yaml-language-server: $schema=https://schemas.neffi.fr/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-check
  namespace: flux-system
spec:
  components:
    - ../../../../components/app-template
  # Reuses the matrix-alerts Secret that disk-check's ExternalSecret owns in kube-system.
  dependsOn:
    - name: disk-check
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cluster-check
      namespace: kube-system
  interval: 1h
  path: ./apps/oliver/kube-system/cluster-check/app
  postBuild:
    substitute:
      APP: cluster-check
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kube-system
