# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  interval: 10m
  chart:
    spec:
      chart: reloader
      version: "2.2.17"
      sourceRef:
        kind: HelmRepository
        name: stakater
  values:
    fullnameOverride: reloader
    reloader:
      enableHA: false
      deployment:
        replicas: 1
        tolerations:
          - key: dedicated
            operator: Equal
            value: slow-node
            effect: NoSchedule
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: [raspberrypi]
      readOnlyRootFileSystem: true
