---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: continuwuity-data
spec:
  repository:
    kind: ClusterRepository
    name: garage-raspberrypi
  credentialProjection:
    enabled: true
  # oliver has no CSI snapshot-controller/VolumeSnapshotClass (local-path only).
  # continuwuity uses RocksDB underneath -- a live Direct copy is a best-effort
  # read, not a consistent checkpoint. Acceptable for now; revisit if
  # continuwuity ever exposes its own backup/checkpoint hook.
  copyMethod: Direct
  compression:
    compressor: zstd
  mover:
    # continuwuity's pod pins runAsUser/runAsGroup: 1000 explicitly (checked
    # live) -> pvcConsumer inherit resolves cleanly, no explicit fallback needed.
    inheritSecurityContextFrom:
      pvcConsumer: {}
  sources:
    - pvc:
        name: continuwuity-data
  retention:
    keepDaily: 14
    keepWeekly: 4
