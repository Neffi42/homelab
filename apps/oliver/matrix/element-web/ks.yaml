---
# yaml-language-server: $schema=https://schemas.neffi.fr/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: element-web
  namespace: flux-system
spec:
  components:
    - ../../../../components/app-template
  dependsOn:
    - name: continuwuity
  interval: 1h
  path: ./apps/oliver/matrix/element-web/app
  postBuild:
    substitute:
      APP: element-web
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: matrix
