---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mautrix-whatsapp
spec:
  chartRef:
    kind: OCIRepository
    name: mautrix-whatsapp
  interval: 1h
  values:
    controllers:
      mautrix-whatsapp:
        type: deployment
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          tolerations:
            - key: dedicated
              operator: Equal
              value: slow-node
              effect: NoSchedule
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [raspberrypi]
        containers:
          app:
            image:
              repository: dock.mau.dev/mautrix/whatsapp
              tag: v0.2610.0@sha256:c807054cb015d0f5c90d20d85aac216d062b4a6f4ae834b931fd5e7f03e27391
            # Bypass docker-run.sh: it chowns /data as root and rewrites the config.
            command: [/usr/bin/mautrix-whatsapp]
            args: [-c, /config/config.yaml, --no-update]
            env:
              TZ: Europe/Paris
            envFrom:
              - secretRef:
                  name: mautrix-whatsapp
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 29318
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60 # DB migrations on first start
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1337
        runAsGroup: 1337
        fsGroup: 1337
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      config:
        type: configMap
        name: mautrix-whatsapp-configmap
        advancedMounts:
          mautrix-whatsapp:
            app:
              - path: /config/config.yaml
                subPath: config.yaml
                readOnly: true
      data:
        type: emptyDir
        advancedMounts:
          mautrix-whatsapp:
            app:
              - path: /data
      tmp:
        type: emptyDir
        advancedMounts:
          mautrix-whatsapp:
            app:
              - path: /tmp
