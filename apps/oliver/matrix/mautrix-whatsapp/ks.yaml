---
# yaml-language-server: $schema=https://schemas.neffi.fr/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mautrix-whatsapp
  namespace: flux-system
spec:
  components:
    - ../../../../components/app-template
  dependsOn:
    - name: continuwuity
    - name: cnpg-cluster
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mautrix-whatsapp
      namespace: matrix
  interval: 1h
  path: ./apps/oliver/matrix/mautrix-whatsapp/app
  postBuild:
    substitute:
      APP: mautrix-whatsapp
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: matrix
