# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dufs
spec:
  chartRef:
    kind: OCIRepository
    name: dufs
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
    controllers:
      dufs:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: docker.io/sigoden/dufs
              tag: v0.47.0
            restartPolicy: Always
            args:
              - /data
            env:
              - name: DUFS_ALLOW_ALL
                value: true
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &httpPort 5000
                    path: /
                  initialDelaySeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 3
                  periodSeconds: 10
              readiness: *probe
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 512Mi
    service:
      dufs:
        controller: dufs
        ports:
          http:
            port: *httpPort
            protocol: TCP
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: media
        advancedMounts:
          dufs:
            app:
              - path: /data
    route:
      http:
        kind: HTTPRoute
        hostnames:
          - "files.neffi.fr"
        parentRefs:
          - name: private
            namespace: network
        rules:
          # oauth2-proxy callback/sign-in, unauthenticated.
          - matches:
              - path:
                  type: PathPrefix
                  value: /oauth2/
            backendRefs:
              - name: dufs-oauth2-proxy
                port: 4180
          # Everything else behind oauth2-proxy. Keep the filter on the catch-all: a broken
          # Middleware disables only its own rule and requests fall through to broader rules.
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: dufs-oauth2-proxy
            backendRefs:
              - name: dufs
                port: *httpPort
