---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dufs
  namespace: flux-system
spec:
  components:
    - ../../../../components/app-template
    - ../../../../components/oauth2-proxy
  dependsOn:
    - name: local-path
    - name: traefik
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: dufs
      namespace: media
  interval: 1h
  path: "./apps/oliver/media/dufs/app"
  postBuild:
    substitute:
      APP: dufs
      OAUTH2_PROXY_HOST: files.neffi.fr
      OAUTH2_PROXY_NAMESPACE: media
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  timeout: 5m
