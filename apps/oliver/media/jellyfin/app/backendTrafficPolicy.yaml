---
# yaml-language-server: $schema=https://schemas.neffi.fr/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: jellyfin-streaming
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: jellyfin
  timeout:
    http:
      # Envoy's default 15s route timeout cuts every direct-play range request (UT)
      requestTimeout: 0s
