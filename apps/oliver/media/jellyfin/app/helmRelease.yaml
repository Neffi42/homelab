# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 10m
  chart:
    spec:
      chart: jellyfin
      version: "3.2.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
  values:
    image:
      repository: docker.io/jellyfin/jellyfin
      tag: "10.11.11@sha256:0b901391a662862eddb5dc55d244d7883cbb6236ef5b9a6ea82abc78a89819f0"
    httpRoute:
      enabled: true
      parentRefs:
        - name: private
          namespace: network
          sectionName: https
      hostnames:
        - "jellyfin.neffi.fr"

    persistence:
      config:
        enabled: true
        storageClass: local-path-oliver
      media:
        enabled: true
        existingClaim: media
        readOnly: true
