---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: local-path
    - name: kopiur-config
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: jellyfin
      namespace: media
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: SnapshotPolicy
      name: jellyfin-config
      namespace: media
  interval: 1h
  path: "./apps/oliver/media/jellyfin/app"
  patches:
    - patch: |
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: SnapshotPolicy
        metadata:
          name: not-used
        spec:
          mover:
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
      target:
        kind: SnapshotPolicy
  postBuild:
    substitute:
      APP: jellyfin
      KOPIUR_NAME: jellyfin-config
      KOPIUR_PVC: jellyfin-config
      KOPIUR_KEEPDAILY: "14"
      KOPIUR_KEEPWEEKLY: "4"
      KOPIUR_CRON: "H 2 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  timeout: 5m
