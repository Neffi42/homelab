# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 10m
  chart:
    spec:
      chart: gateway-helm
      version: "1.8.3"
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
  values:
    deployment:
      pod:
        nodeSelector:
          kubernetes.io/arch: amd64
