# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-ovh
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: external-dns
  values:
    fullnameOverride: external-dns-ovh
    provider:
      name: ovh
    env:
      - name: OVH_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: ovh-credentials
            key: oauth2ClientID
      - name: OVH_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: ovh-credentials
            key: oauth2ClientSecret
    sources:
      - gateway-httproute
    policy: sync
    registry: txt
    txtOwnerId: oliver
    # Record type in a prefix label keeps the apex's TXT record inside the zone (_extdns-a.neffi.fr).
    txtPrefix: "_extdns-%{record_type}."
    domainFilters:
      - neffi.fr
    extraArgs:
      gateway-name: public
      gateway-namespace: network
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
