# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-pihole
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: external-dns
  values:
    fullnameOverride: external-dns-pihole
    provider:
      name: pihole
    env:
      - name: EXTERNAL_DNS_PIHOLE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: pi-hole-credentials
            key: FTLCONF_webserver_api_password
    sources:
      - gateway-httproute
    policy: sync
    # Pi-hole can't store TXT records: no ownership, every A record in the domain is managed.
    registry: noop
    domainFilters:
      - neffi.fr
    extraArgs:
      pihole-server: http://pi-hole.network.svc.cluster.local
      gateway-name: private
      gateway-namespace: network
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
