# yaml-language-server: $schema=https://schemas.neffi.fr/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: traefik
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    global:
      # Drop headers whose name aliases another (X_Auth_User for X-Auth-User): CGI-style backends
      # would read them as the header Traefik manages.
      aliasHeadersStrategy: delete
    providers:
      kubernetesCRD:
        enabled: true
        # Collision-safe generated names (namespace_name@kubernetescrd).
        safeNaming: true
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: true
        # TCPRoute is experimental-channel only.
        experimentalChannel: true
        # Routes in these namespaces may target Traefik internals (api@internal for the dashboard).
        crossProviderNamespaces:
          - network
    ingressClass:
      enabled: false
    # Gateways are ours (network/traefik/config), not the chart's.
    gateway:
      enabled: false
    gatewayClass:
      name: traefik
    # Lets the non-root Traefik bind 443/53 directly. Only affects the pod's own network namespace;
    # containerd 2.x already defaults to this, set explicitly so it doesn't depend on runtime config.
    podSecurityContext:
      sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
    # A Gateway listener's port must equal its entrypoint's container port; the Service maps the
    # client-facing port to it (only the UDP entrypoints differ).
    # UDP entrypoints must not share a container port with any TCP listener: the Gateway provider
    # matches listeners to entrypoints by port only and can pick the UDP one.
    ports:
      web: null
      websecure: null
      https-private:
        # Traefik CRD routes that don't list entryPoints land here only, never on https-public.
        asDefault: true
        port: 443
        exposedPort: 443
        expose: &expose
          default: true
        protocol: TCP
        transport: &noReadTimeout
          respondingTimeouts:
            # Default 60s caps the whole request body read: cuts long uploads.
            readTimeout: "0s"
      https-public:
        port: 4443
        exposedPort: 4443
        expose: *expose
        protocol: TCP
        transport: *noReadTimeout
      ssh:
        port: 2222
        exposedPort: 2222
        expose: *expose
        protocol: TCP
      dns-tcp:
        port: 53
        exposedPort: 53
        expose: *expose
        protocol: TCP
      dns-udp:
        port: 54
        exposedPort: 53
        expose: *expose
        protocol: UDP
      webrtc-tcp:
        port: 8555
        exposedPort: 8555
        expose: *expose
        protocol: TCP
      webrtc-udp:
        port: 8556
        exposedPort: 8555
        expose: *expose
        protocol: UDP
    additionalArguments:
      # Default 3s idle UDP session is too short for WebRTC media.
      - --entryPoints.webrtc-udp.udp.timeout=30s
    # ServiceLB binds these ports on oliver; WAN only reaches what the router forwards (4443, 2222).
    service:
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Local
        # oliver's Tailscale address: clients of the private Gateway.
        externalIPs:
          - 100.110.121.73
