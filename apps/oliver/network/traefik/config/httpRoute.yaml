---
# yaml-language-server: $schema=https://schemas.neffi.fr/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traefik-dashboard
spec:
  hostnames:
    - traefik.neffi.fr
  parentRefs:
    - name: private
      namespace: network
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            # Without scheme/port the redirect would use the listener port (8443).
            scheme: https
            port: 443
            path:
              type: ReplaceFullPath
              replaceFullPath: /dashboard/
            statusCode: 302
    # oauth2-proxy callback/sign-in, unauthenticated.
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2/
      backendRefs:
        - name: traefik-oauth2-proxy
          port: 4180
    # Dashboard (/dashboard/) and its API (/api/). Keep the filter on the catch-all: a broken
    # Middleware disables only its own rule and requests fall through to broader rules.
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: traefik-oauth2-proxy
      backendRefs:
        - group: traefik.io
          kind: TraefikService
          name: api@internal
