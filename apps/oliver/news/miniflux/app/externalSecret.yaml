---
# yaml-language-server: $schema=https://schemas.neffi.fr/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: miniflux
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://miniflux:{{ .db_password }}@cnpg-cluster-rw.database.svc.cluster.local:5432/miniflux?sslmode=require"
        OAUTH2_CLIENT_SECRET: "{{ .oauth_client_secret }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: "1fd94904-63af-4a5b-b79f-b50500e33ce8"
    - secretKey: oauth_client_secret
      remoteRef:
        key: "c077d2d0-4c30-4e4b-96a3-b50500e48497"
