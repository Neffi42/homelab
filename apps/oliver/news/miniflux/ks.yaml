---
# yaml-language-server: $schema=https://schemas.neffi.fr/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: miniflux
  namespace: flux-system
spec:
  components:
    - ../../../../components/app-template
  dependsOn:
    - name: cnpg-cluster
    - name: kanidm
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: miniflux
      namespace: news
  interval: 1h
  path: ./apps/oliver/news/miniflux/app
  postBuild:
    substitute:
      APP: miniflux
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: news
