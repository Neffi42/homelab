---
# yaml-language-server: $schema=https://schemas.neffi.fr/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: readeck
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: readeck
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        READECK_DATABASE_SOURCE: "postgres://readeck:{{ .db_password }}@cnpg-cluster-rw.database.svc.cluster.local:5432/readeck?sslmode=require"
        READECK_AUTH_OIDC_PROVIDERS_1_CLIENT_SECRET: "{{ .oauth_client_secret }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: "39fe305a-af4d-40f4-a4fc-b50500e3803e"
    - secretKey: oauth_client_secret
      remoteRef:
        key: "3baa3bdf-6cc1-4ff8-8da7-b50500e49406"
