---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: readeck
spec:
  chartRef:
    kind: OCIRepository
    name: readeck
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      # Pinned so kopiur's mover inherits a UID that can read the volume.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      readeck:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: codeberg.org/readeck/readeck
              tag: 0.23.5@sha256:17dea468f4f713930338062f58a3a5e0d04e37d2961ddb827792e223f3db91b4
            env:
              TZ: Europe/Paris
              READECK_SERVER_BASE_URL: https://read.neffi.fr
              READECK_AUTH_OIDC_PROVIDERS_1_NAME: Kanidm
              READECK_AUTH_OIDC_PROVIDERS_1_URL: https://auth.neffi.fr/oauth2/openid/readeck
              READECK_AUTH_OIDC_PROVIDERS_1_CLIENT_ID: readeck
              READECK_AUTH_OIDC_PROVIDERS_1_PROVISIONING: "true"
              # Kanidm's "groups" scope sends group SPNs, not short names.
              READECK_AUTH_OIDC_PROVIDERS_1_GROUPS: app_admins@auth.neffi.fr=admin
            envFrom:
              - secretRef:
                  name: readeck
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &httpPort 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
    service:
      readeck:
        controller: readeck
        ports:
          http:
            port: *httpPort
            protocol: TCP
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: local-path-oliver-ssd
        size: 5Gi
        globalMounts:
          - path: /readeck
    route:
      http:
        kind: HTTPRoute
        hostnames:
          - "read.neffi.fr"
        parentRefs:
          - name: private
            namespace: network
        rules:
          - backendRefs:
              - name: readeck
                port: *httpPort
