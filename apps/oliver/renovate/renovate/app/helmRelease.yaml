# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
spec:
  chartRef:
    kind: OCIRepository
    name: renovate
  interval: 1h
  values:
    controllers:
      renovate:
        type: cronjob
        cronjob:
          schedule: "0 8,20 * * *"
          concurrencyPolicy: Replace
          startingDeadlineSeconds: 1800
          ttlSecondsAfterFinished: 86400
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          renovate:
            image:
              repository: renovate/renovate
              tag: 44.222.5@sha256:8a4c49ef19bb71bedf4eaa4d1087a31a1793bd53de41478753d2d648e53eed19
            restartPolicy: Never
            env:
              TZ: Europe/Paris
              LOG_LEVEL: debug
              RENOVATE_BASE_DIR: "/tmp/renovate/"
              RENOVATE_PR_HOURLY_LIMIT: "15"
            envFrom:
              - secretRef:
                  name: renovate-credentials
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 1Gi
      check:
        type: cronjob
        cronjob:
          schedule: "0 9 * * 0"
          concurrencyPolicy: Forbid
          backoffLimit: 0
          ttlSecondsAfterFinished: 86400
          successfulJobsHistory: 1
          failedJobsHistory: 1
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
        containers:
          app:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
            command: [sh, /scripts/renovate-check.sh]
            env:
              FORGEJO_URL: https://code.neffi.fr
              REPO: Neffi42/homelab
              BOT: bot-oliver
              MAX_AGE_DAYS: "4"
              MATRIX_ADDRESS: http://continuwuity.matrix.svc.cluster.local
              MATRIX_ROOM: "!gPFPE-MqiqNH1zLGQbTpLwPiIedUn5F4PE6scgkeAVQ"
              MATRIX_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: matrix-alerts
                    key: token
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
    persistence:
      work-volume:
        enabled: true
        type: emptyDir
        advancedMounts:
          renovate:
            renovate:
              - path: /tmp/renovate/
      script:
        type: configMap
        name: renovate-check
        advancedMounts:
          check:
            app:
              - path: /scripts
                readOnly: true
