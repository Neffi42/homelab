# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
spec:
  chartRef:
    kind: OCIRepository
    name: renovate
  interval: 1h
  values:
    controllers:
      renovate:
        type: cronjob
        cronjob:
          schedule: "0 8,20 * * *"
          concurrencyPolicy: Replace
          startingDeadlineSeconds: 1800
          ttlSecondsAfterFinished: 86400
          successfulJobsHistory: 1
          failedJobsHistory: 1
        pod:
          tolerations:
            - key: dedicated
              operator: Equal
              value: slow-node
              effect: NoSchedule
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [raspberrypi]
        containers:
          renovate:
            image:
              repository: renovate/renovate
              tag: 44.117.0@sha256:23a7b278b1ed21108cbf872f7464aeff1a7f0df786fc09d3217ef7e55b483665
            restartPolicy: Never
            env:
              TZ: Europe/Paris
              LOG_LEVEL: debug
              RENOVATE_BASE_DIR: "/tmp/renovate/"
              RENOVATE_PR_HOURLY_LIMIT: "15"
            envFrom:
              - secretRef:
                  name: renovate-credentials
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 1Gi
    persistence:
      work-volume:
        enabled: true
        type: emptyDir
        advancedMounts:
          renovate:
            renovate:
              - path: /tmp/renovate/
