# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
spec:
  chartRef:
    kind: OCIRepository
    name: vaultwarden
  interval: 1h
  values:
    controllers:
      main:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/vaultwarden/server
              tag: 1.37.1-alpine
            envFrom:
              - secret: vaultwarden-sso-credentials
            env:
              - name: DOMAIN
                value: "https://vaultwarden.neffi.fr"
              - name: SSO_ENABLED
                value: true
              - name: SSO_ONLY
                value: true
              - name: SSO_AUTHORITY
                value: https://auth.neffi.fr/oauth2/openid/vaultwarden
              - name: SSO_SCOPES
                value: "openid profile email groups_name"

            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &httpPort 80
                    path: /
                  initialDelaySeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
                  periodSeconds: 10
              readiness: *probe
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 256Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: *httpPort
            protocol: TCP
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: local-path-oliver-ssd
        accessMode: ReadWriteOnce
        size: 100Mi
        advancedMounts:
          main:
            app:
              - path: /data
    route:
      webui:
        kind: HTTPRoute
        hostnames:
          - "vaultwarden.neffi.fr"
        parentRefs:
          - name: private
            namespace: network
        rules:
          - backendRefs:
              - name: vaultwarden
                port: *httpPort
