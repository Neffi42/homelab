---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: firefox
  namespace: flux-system
spec:
  components:
    - ../../../../components/app-template
    - ../../../../components/oauth2-proxy
  dependsOn:
    - name: local-path
    - name: traefik
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: firefox
      namespace: selfhosted
  interval: 1h
  path: "./apps/oliver/selfhosted/firefox/app"
  postBuild:
    substitute:
      APP: firefox
      OAUTH2_PROXY_HOST: firefox.neffi.fr
      OAUTH2_PROXY_NAMESPACE: selfhosted
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
