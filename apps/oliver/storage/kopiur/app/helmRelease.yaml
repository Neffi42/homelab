---
# yaml-language-server: $schema=https://schemas.neffi.fr/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kopiur
  values:
    installScope: cluster
    # Controller only: the webhook has its own values and must stay on oliver.
    tolerations:
      - key: dedicated
        operator: Equal
        value: slow-node
        effect: NoSchedule
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [raspberrypi]
    features:
      credentialProjection:
        enabled: true
