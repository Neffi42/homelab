---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur
  namespace: flux-system
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kopiur
      namespace: storage
  interval: 1h
  path: "./apps/oliver/storage/kopiur/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: storage
  timeout: 5m
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur-config
  namespace: flux-system
spec:
  dependsOn:
    - name: kopiur
  # TEMP: garage-raspberrypi is down (disk I/O errors, 3rd occurrence, see
  # docs/incidents/2026-09-03-garage-hdd-emergency-ro.md) so this health check
  # never passes. Bypassed so kopiur-config (and everything depending on it)
  # can go Ready again. Re-enable once the repository recovers.
  healthChecks:
    # - apiVersion: kopiur.home-operations.com/v1alpha1
    #   kind: ClusterRepository
    #   name: garage-raspberrypi
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: ClusterRepository
      name: hetzner-1
  interval: 1h
  path: "./apps/oliver/storage/kopiur/config"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
