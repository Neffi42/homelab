---
# yaml-language-server: $schema=https://schemas.neffi.fr/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wine-machine-identity
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
    - secretKey: identity.env
      remoteRef:
        key: "8fec3ce8-c970-409a-b190-b4d900fb8324"
    # UTF-16 LE with BOM, which Wine's regedit needs: stored base64-encoded in Bitwarden.
    - secretKey: identity.reg
      remoteRef:
        key: "85d2eb76-543e-44e7-bf90-b4d900fbb7a1"
        decodingStrategy: Base64
---
# yaml-language-server: $schema=https://schemas.neffi.fr/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wine-machine-credentials
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
    # RDP password, SHA-512 crypt hash (openssl passwd -6).
    - secretKey: USER_PASSWD
      remoteRef:
        key: "0ac41fd9-b011-4cc7-b9f2-b4d900fc09d1"
