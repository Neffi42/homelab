# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wine-machine
spec:
  chartRef:
    kind: OCIRepository
    name: wine-machine
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      # Wine takes the Windows computer name from the pod hostname.
      hostname: ${WIN_HOSTNAME}
      # Pinned so the kopiur mover inherits root: the entrypoint starts as root and the home is owned by 1000.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      # wine-machine-init needs up to 30s to flush the registry on SIGTERM.
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: amd64
    controllers:
      wine-machine:
        # One writer per Wine prefix, one live copy of the identity.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: code.neffi.fr/neffi42/wine-machine
              tag: 0.1.0@sha256:409065bd39187f6e01a1ec3c385cfae49283ae9b0ae79c274084d8629a993e82
            envFrom:
              - secretRef:
                  name: wine-machine-credentials
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    service:
      wine-machine:
        controller: wine-machine
        ports:
          rdp:
            port: &rdpPort 3389
            protocol: TCP
    persistence:
      identity:
        type: secret
        name: wine-machine-identity
        globalMounts:
          - path: /opt/identity
            readOnly: true
      # Wine prefix + D: drive. Mounted at /home rather than /home/<WIN_USER> to keep the user name
      # out of this repo; docker-wine creates and chowns the user's home inside it.
      home:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: /home
    route:
      rdp:
        kind: TCPRoute
        parentRefs:
          - name: private
            namespace: network
            sectionName: rdp
        rules:
          - backendRefs:
              - name: wine-machine
                port: *rdpPort
