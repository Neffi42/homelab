---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wine-machine-vars
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-config
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: wine-machine-vars
      namespace: flux-system
  interval: 1h
  path: "./apps/oliver/wine-machine/wine-machine/vars"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
  timeout: 5m
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wine-machine
  namespace: flux-system
spec:
  components:
    - ../../../../components/kopiur
    - ../../../../components/app-template
  dependsOn:
    - name: local-path
    - name: kopiur-config
    - name: external-secrets-config
    - name: wine-machine-vars
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: wine-machine
      namespace: wine-machine
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: SnapshotPolicy
      name: wine-machine
      namespace: wine-machine
  interval: 1h
  path: "./apps/oliver/wine-machine/wine-machine/app"
  postBuild:
    substitute:
      APP: wine-machine
      KOPIUR_KEEPDAILY: "14"
    # WIN_HOSTNAME: identity values stay out of this public repo.
    substituteFrom:
      - kind: Secret
        name: wine-machine-vars
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: wine-machine
  timeout: 5m
