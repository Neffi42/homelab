---
# yaml-language-server: $schema=https://schemas.neffi.fr/external-secrets.io/externalsecret_v1.json
# postBuild.substituteFrom input for the wine-machine Kustomization, derived from the same
# identity.env the pod mounts so the hostname has a single source. Lowercased: pod hostnames must be
# RFC 1123 labels; Windows computer names are case-insensitive and Wine reports them uppercased.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wine-machine-vars
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: wine-machine-vars
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        WIN_HOSTNAME: '{{ .env | regexFind "(?m)^WIN_HOSTNAME=.*$" | trimPrefix "WIN_HOSTNAME=" | trimAll "\"\r" | lower }}'
  data:
    - secretKey: env
      remoteRef:
        key: "8fec3ce8-c970-409a-b190-b4d900fb8324"
