---
containers:
  - name: main
    image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04
    imagePullPolicy: IfNotPresent
    env:
      - name: DEBIAN_FRONTEND
        value: noninteractive
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 2Gi
restartPolicy: Never
