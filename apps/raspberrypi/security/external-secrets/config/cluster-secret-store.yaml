apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-secretsmanager
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: https://api.bitwarden.eu
      identityURL: https://identity.bitwarden.eu
      auth:
        secretRef:
          credentials:
            key: token
            name: bitwarden-access-token
            namespace: security
      bitwardenServerSDKURL: https://bitwarden-sdk-server.security.svc.cluster.local:9998
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        key: tls.crt
        namespace: security
      organizationID: 0bcdb154-984a-4dbb-9639-b3f401453583
      projectID: dc7cda66-4588-4bd9-9071-b4880115d69f
