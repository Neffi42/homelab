# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
spec:
  interval: 10m
  chart:
    spec:
      chart: garage
      version: "0.7.1"
      sourceRef:
        kind: HelmRepository
        name: garage-helm
  values:
    garage:
      blockSize: "10485760"
      dbEngine: sqlite
      replicationFactor: 1
      metadataAutoSnapshotInterval: "6h"
      s3:
        api:
          rootDomain: ".s3.pi.neffi.fr"
        web:
          rootDomain: ".web.pi.neffi.fr"

    clusterConfig:
      enabled: true
      buckets:
        - name: backups
      keys:
        internal-key:
          secretName: internal-key
          buckets:
            - backups

    deployment:
      replicaCount: 1

    persistence:
      enabled: true
      meta:
        storageClass: "local-path-sd"
      data:
        storageClass: "local-path-hdd"

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 100m
        memory: 1024Mi

    gatewayApi:
      s3:
        api:
          enabled: true
          hostnames:
            - "s3.pi.neffi.fr"
          parentRefs:
            - name: private
