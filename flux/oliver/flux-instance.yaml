---
# yaml-language-server: $schema=https://schemas.neffi.fr/fluxcd.controlplane.io/fluxinstance_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "1h"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  distribution:
    version: "2.9.5"
    registry: "ghcr.io/fluxcd"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: "cluster.local"
  sync:
    kind: GitRepository
    # In-cluster Service: keeps Flux independent of the Gateways, Pi-hole and router hairpin NAT.
    url: "http://forgejo-http.forgejo.svc.cluster.local:3000/Neffi42/homelab.git"
    ref: "refs/heads/main"
    path: "flux/oliver"
    pullSecret: "flux-system"
    interval: "1m"
