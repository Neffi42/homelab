# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-cluster
spec:
  interval: 10m
  chart:
    spec:
      chart: cluster
      version: "0.6.1"
      sourceRef:
        kind: HelmRepository
        name: cnpg
  values:
    cluster:
      instances: 2
