---
# yaml-language-server: $schema=https://schemas.neffi.fr/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-cluster
  namespace: database
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:58c9a9e29a23b814f8f335ce178727d83bc40d96ed7fe8977192d2d8cdcb3927
  affinity:
    nodeSelector:
      kubernetes.io/hostname: oliver
  storage:
    size: 8Gi
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: app-db-credentials
  managed:
    roles:
      - name: ferdium
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: ferdium-credentials
