---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ferdium
  namespace: flux-system
spec:
  dependsOn:
    - name: local-path
    - name: cnpg-cluster
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: ferdium
      namespace: ferdium
  interval: 1h
  path: "./kubernetes/apps/ferdium/ferdium/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ferdium
  timeout: 5m
