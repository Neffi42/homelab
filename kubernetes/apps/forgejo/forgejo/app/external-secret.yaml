---
# yaml-language-server: $schema=https://schemas.neffi.fr/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oauth-credentials
  namespace: forgejo
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: forgejo-oauth-credentials
    template:
      data:
        key: "{{ .oauth_id }}"
        secret: "{{ .oauth_secret }}"
  data:
    - secretKey: oauth_id
      remoteRef:
        key: "6c77450d-1727-4d34-a894-b458010b0f98"
    - secretKey: oauth_secret
      remoteRef:
        key: "d49ced84-3a5c-4d00-9c35-b458010b3a95"
---
# yaml-language-server: $schema=https://schemas.neffi.fr/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-db-credentials
  namespace: forgejo
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: forgejo-db-credentials
    template:
      data:
        database: |
          DB_TYPE = postgres
          HOST = cnpg-pooler-rw.database.svc.cluster.local
          NAME = forgejo
          USER = forgejo
          PASSWD = {{ .db_password }}
  data:
    - secretKey: db_password
      remoteRef:
        key: "fde5e0b2-c572-4149-8031-b45700925999"
---
# yaml-language-server: $schema=https://schemas.neffi.fr/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-signing-credentials
  namespace: forgejo
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: forgejo-signing-credentials
    template:
      data:
        ed25519: |
          {{ .private_key | b64dec }}
        ed25519.pub: |
          {{ .public_key }}
  data:
    - secretKey: private_key
      remoteRef:
        key: "db91d976-5fc8-49da-b234-b458016537ab"
    - secretKey: public_key
      remoteRef:
        key: "643abbde-2c00-4983-a365-b459014e0065"
---
