---
# yaml-language-server: $schema=https://schemas.neffi.fr/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo
  interval: 1h
  values:
    image:
      rootless: true
      registry: code.forgejo.org
      repository: forgejo/forgejo
      tag: 15.0.2-rootless
    persistence:
      enabled: true
      storageClass: local-path-oliver-ssd
    service:
      http:
        port: &httpPort 3000
      ssh:
        port: 22
    httpRoute:
      enabled: true
      hostnames:
        - &hostname "code.neffi.fr"
      parentRefs:
        - name: &gateway public
          namespace: &gatewayNs network
          sectionName: https
      port: *httpPort
    tcpRoute:
      enabled: true
      parentRefs:
        - name: *gateway
          namespace: *gatewayNs
          sectionName: ssh
    extraContainerVolumeMounts:
      - name: signing-key
        mountPath: /data/signing
        readOnly: true
    extraInitVolumeMounts:
      - name: signing-key
        mountPath: /data/signing
        readOnly: true
    extraVolumes:
      - name: signing-key
        secret:
          defaultMode: 0400
          secretName: forgejo-signing-credentials
    extraVolumeMounts:
      - name: signing-key
        mountPath: /data/signing
        readOnly: true
    gitea:
      admin:
        username: ""
      oauth:
        - name: zitadel
          provider: openidConnect
          adminGroup: admin
          autoDiscoverUrl: https://auth.neffi.fr/.well-known/openid-configuration
          existingSecret: forgejo-oauth-credentials
          groupClaimName: "urn:zitadel:iam:org:project:roles"
          scopes: "email profile urn:zitadel:iam:org:project:roles"
      additionalConfigSources:
        - secret:
            secretName: forgejo-db-credentials
      config:
        APP_NAME: &appName "code ~ neffi"
        APP_SLOGAN: ""
        ui.meta:
          AUTHOR: Neffi
          DESCRIPTION: *appName
        cache:
          ENABLED: true
          ADAPTER: redis
          HOST: &dragonfly redis://dragonfly.database.svc:6379/2?pool_size=100&idle_timeout=180s
        queue:
          TYPE: redis
          CONN_STR: *dragonfly
        session:
          PROVIDER: redis
          PROVIDER_CONFIG: *dragonfly
        cron.archive_cleanup:
          ENABLED: true
          RUN_AT_START: true
          SCHEDULE: "@every 1h"
          OLDER_THAN: 2h
        indexer:
          ISSUE_INDEXER_TYPE: bleve
          REPO_INDEXER_ENABLED: true
        lfs:
          PATH: /data/git/lfs
        mailer:
          ENABLED: false
        repository:
          DEFAULT_REPO_UNITS: repo.code,repo.releases,repo.pulls,repo.actions
          DISABLED_REPO_UNITS: repo.ext_wiki,repo.ext_issues
          DISABLE_DOWNLOAD_SOURCE_ARCHIVES: true
          ENABLE_PUSH_CREATE_USER: true
          ROOT: /data/git/repositories
        repository.pull-request:
          DEFAULT_DELETE_BRANCH_AFTER_MERGE: true
          DEFAULT_MERGE_STYLE: squash
          DEFAULT_UPDATE_STYLE: squash
        repository.signing:
          FORMAT: ssh
          SIGNING_KEY: /data/signing/ed25519.pub
          SIGNING_NAME: code.neffi.fr Instance
          SIGNING_EMAIL: noreply@code.neffi.fr
          INITIAL_COMMIT: pubkey
          CRUD_ACTIONS: "pubkey, parentsigned"
          WIKI: never
          MERGES: pubkey
        security:
          REVERSE_PROXY_TRUSTED_PROXIES: 10.42.0.0/16
        server:
          APP_DATA_PATH: /data/gitea
          ROOT_URL: https://code.neffi.fr
          DOMAIN: *hostname
          SSH_DOMAIN: *hostname
        service:
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
          DEFAULT_ENABLE_TIMETRACKING: false
          ENABLE_INTERNAL_SIGNIN: false
          ENABLE_PASSWORD_SIGNIN_FORM: false
          SHOW_REGISTRATION_BUTTON: false
        webhook:
          ALLOWED_HOST_LIST: "*"
        other:
          SHOW_FOOTER_VERSION: false
        openid:
          ENABLE_OPENID_SIGNIN: false
          ENABLE_OPENID_SIGNUP: false
