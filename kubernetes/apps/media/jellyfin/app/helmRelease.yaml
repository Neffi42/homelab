# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 10m
  chart:
    spec:
      chart: jellyfin
      version: "3.2.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
  values:
    httpRoute:
      enabled: true
      parentRefs:
        - name: private
          namespace: network
          sectionName: https
      hostnames:
        - "jellyfin.neffi.fr"

    persistence:
      config:
        enabled: true
        storageClass: local-path-oliver
      media:
        enabled: true
        accessMode: ReadWriteOnce
        storageClass: local-path-oliver-hdd
        readOnly: true
