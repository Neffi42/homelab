# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 10m
  chart:
    spec:
      chart: longhorn
      version: "1.11.2"
      sourceRef:
        kind: HelmRepository
        name: longhorn
  values:
    preUpgradeChecker:
      jobEnabled: false
    defaultSettings:
      defaultDataPath: "/var/lib/longhorn"
      defaultReplicaCount: 2
    persistence:
      defaultClassReplicaCount: 1
      defaultDiskSelector:
        enable: true
        selector: "default"
    httproute:
      enabled: true
      parentRefs:
        - name: private
          namespace: network
          sectionName: https
      hostnames:
        - longhorn.neffi.fr
      path: /
      pathType: PathPrefix
