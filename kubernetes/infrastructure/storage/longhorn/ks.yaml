---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: longhorn
      namespace: storage
  interval: 1h
  path: "./kubernetes/infrastructure/storage/longhorn/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: storage
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-config
  namespace: flux-system
spec:
  dependsOn:
    - name: longhorn
  healthChecks:
    - apiVersion: storage.k8s.io/v1
      kind: StorageClass
      name: ssd
    - apiVersion: storage.k8s.io/v1
      kind: StorageClass
      name: hdd
  interval: 1h
  path: "./kubernetes/infrastructure/storage/longhorn/config"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
